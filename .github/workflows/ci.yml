name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint, TypeCheck, Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run axe-core accessibility tests
        env:
          STORYBOOK_PORT: 6006
        run: |
          # Start Storybook in background
          npx storybook dev --no-open --port ${{ env.STORYBOOK_PORT }} &
          STORYBOOK_PID=$!
          # Wait for Storybook to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:6006/ > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # Run accessibility tests
          npx playwright test .github/tests/accessibility.spec.ts
          kill $STORYBOOK_PID 2>/dev/null || true
